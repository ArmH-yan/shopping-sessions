[package]
name = "shopping"
version = "0.1.0"
edition = "2024"

[dependencies]
memmap2 = "0.9"
rayon = "1"
ahash = "0.8"
memchr = "2"
libc = "0.2"
arrow = { version = "57", default-features = false }
parquet = { version = "57", default-features = false, features = ["arrow"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
